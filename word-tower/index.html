<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffcf3f">
<meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>
<title>מגדל המילים</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Secular+One&family=Rubik:wght@400;600;800&display=swap">
<style>
/* Layout: one-screen toy — target card on top, block well in the middle, chunky controls at the thumb */
:root {
  --sun: #ffcf3f;       /* page ground */
  --sun-deep: #f2b417;
  --ink: #23214a;       /* text, outlines */
  --well: #24306b;      /* board */
  --well-line: #2f3d82;
  --paper: #fff8e1;     /* cards */
  --t0: #ff6b6b; --t1: #1fb5ab; --t2: #7c5cff; --t3: #ff9f1c; --t4: #2ec27e; --t5: #ff5cb8;
  --font-display: "Secular One", "Rubik", "Arial Hebrew", "Noto Sans Hebrew", sans-serif;
  --font-body: "Rubik", "Arial Hebrew", "Noto Sans Hebrew", system-ui, sans-serif;
  --cell: 48px;
  color-scheme: light;
}
html, body { height: 100%; margin: 0; }
[hidden] { display: none !important; }
body {
  background: var(--sun); color: var(--ink); font-family: var(--font-body);
  overflow: hidden; touch-action: manipulation; user-select: none; -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.app {
  height: 100%; display: flex; flex-direction: column; gap: 10px; direction: rtl;
  max-width: 560px; margin: 0 auto; box-sizing: border-box;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.top { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: stretch; }
.target {
  background: var(--paper); border: 3px solid var(--ink); border-radius: 18px;
  box-shadow: 0 5px 0 var(--ink); padding: 8px 12px; display: flex; align-items: center; gap: 12px; min-width: 0;
}
.target .emoji { font-size: 44px; line-height: 1; }
.target .label { font-size: 12px; font-weight: 600; letter-spacing: .03em; opacity: .75; }
.target .word { font-family: var(--font-display); font-size: 30px; line-height: 1.1; }
.slots { display: flex; gap: 4px; margin-top: 2px; }
.slots span {
  width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center;
  font-family: var(--font-display); font-size: 15px; color: #fff; border: 2px solid var(--ink);
}
.side { display: flex; flex-direction: column; gap: 6px; }
.stat {
  background: var(--paper); border: 3px solid var(--ink); border-radius: 14px; padding: 4px 10px;
  text-align: center; min-width: 74px;
}
.stat b { display: block; font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
.stat small { font-size: 11px; font-weight: 600; opacity: .75; }
.next { display: flex; align-items: center; justify-content: center; gap: 6px; }
.next .mini {
  width: 30px; height: 30px; border-radius: 8px; border: 2px solid var(--ink); display: grid; place-items: center;
  font-family: var(--font-display); font-size: 20px; color: #fff;
}

.wellwrap { flex: 1; min-height: 0; display: grid; place-items: center; position: relative; }
.board {
  display: grid; direction: rtl;
  grid-template-columns: repeat(6, var(--cell)); grid-template-rows: repeat(9, var(--cell));
  background: var(--well); border: 4px solid var(--ink); border-radius: 16px; padding: 4px; gap: 3px;
  box-shadow: 0 6px 0 var(--ink); position: relative; touch-action: none;
}
.cell {
  border-radius: 10px; background: var(--well-line); display: grid; place-items: center;
  font-family: var(--font-display); font-size: calc(var(--cell) * .62); color: #fff; line-height: 1;
  text-shadow: 0 2px 0 rgba(0,0,0,.28);
}
.cell.tile { box-shadow: inset 0 -5px 0 rgba(0,0,0,.22), inset 0 3px 0 rgba(255,255,255,.3); }
.cell.falling { outline: 3px solid #fff; outline-offset: -3px; }
.cell.ghost { background: transparent; box-shadow: inset 0 0 0 2px rgba(255,255,255,.45); color: rgba(255,255,255,.45); text-shadow: none; }
.cell.pop { animation: pop .55s ease-out forwards; }
@keyframes pop {
  0% { transform: scale(1); filter: brightness(1); }
  35% { transform: scale(1.18); filter: brightness(1.6); box-shadow: 0 0 18px #fff; }
  100% { transform: scale(0); opacity: 0; }
}
.t0 { background: var(--t0); } .t1 { background: var(--t1); } .t2 { background: var(--t2); }
.t3 { background: var(--t3); } .t4 { background: var(--t4); } .t5 { background: var(--t5); }

.toast {
  position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%);
  background: var(--paper); border: 3px solid var(--ink); border-radius: 18px; box-shadow: 0 5px 0 var(--ink);
  padding: 10px 18px; display: flex; align-items: center; gap: 10px; pointer-events: none;
  font-family: var(--font-display); font-size: 30px; animation: rise 1.1s ease-out forwards; white-space: nowrap;
}
.toast .e { font-size: 40px; }
.toast.big { font-size: 40px; padding: 14px 24px; flex-direction: column; gap: 2px; }
.toast.big .e { font-size: 72px; }
.toast.big small { font-family: var(--font-body); font-size: 16px; font-weight: 800; }
@keyframes rise {
  0% { opacity: 0; transform: translate(-50%, -30%) scale(.7); }
  15% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); }
  75% { opacity: 1; transform: translate(-50%, -55%) scale(1); }
  100% { opacity: 0; transform: translate(-50%, -75%) scale(.95); }
}

.controls { display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 10px; direction: ltr; }
button {
  font: inherit; color: var(--ink); background: var(--paper); border: 3px solid var(--ink); border-radius: 16px;
  box-shadow: 0 5px 0 var(--ink); cursor: pointer; touch-action: manipulation;
}
button:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
.controls button { height: 62px; font-size: 30px; font-weight: 800; }
.controls .drop { background: var(--t4); color: #fff; }
.controls .small { width: 54px; font-size: 22px; display: flex; flex-direction: column; gap: 4px; padding: 0; height: 62px; }
.controls .small button { height: 29px; font-size: 16px; border-radius: 10px; box-shadow: 0 2px 0 var(--ink); border-width: 2px; }

.overlay {
  position: fixed; inset: 0; background: rgba(35,33,74,.55); display: grid; place-items: center; z-index: 20;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.panel {
  background: var(--paper); border: 4px solid var(--ink); border-radius: 24px; box-shadow: 0 8px 0 var(--ink);
  padding: 22px 20px; width: min(380px, 100%); box-sizing: border-box; text-align: center; direction: rtl;
  display: flex; flex-direction: column; gap: 14px;
}
.panel h1 { font-family: var(--font-display); font-weight: 400; font-size: 44px; margin: 0; line-height: 1; text-wrap: balance; }
.panel .demo { display: flex; justify-content: center; gap: 5px; direction: rtl; }
.panel .demo span {
  width: 42px; height: 42px; border-radius: 10px; display: grid; place-items: center; color: #fff;
  font-family: var(--font-display); font-size: 26px; border: 2px solid var(--ink);
  box-shadow: inset 0 -4px 0 rgba(0,0,0,.2);
}
.panel p { margin: 0; font-size: 16px; line-height: 1.5; }
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.modes button { padding: 12px 6px; font-size: 20px; font-weight: 800; }
.modes button small { display: block; font-size: 12px; font-weight: 600; opacity: .8; }
.modes .easy { background: var(--t1); color: #fff; }
.modes .norm { background: var(--t2); color: #fff; }
.score-big { font-size: 46px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }
.learned { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; font-size: 15px; }
.learned span { background: #fff; border: 2px solid var(--ink); border-radius: 999px; padding: 2px 10px; }

@media (prefers-reduced-motion: reduce) {
  .cell.pop { animation: fade .4s linear forwards; }
  .toast { animation: fade 1.1s linear reverse forwards; }
  @keyframes fade { to { opacity: 0; } }
}
</style>

<div class="app">
  <div class="top">
    <div class="target" aria-live="polite">
      <div class="emoji" id="tEmoji">🐶</div>
      <div>
        <div class="label">בנו את המילה</div>
        <div class="word" id="tWord">כלב</div>
        <div class="slots" id="tSlots"></div>
      </div>
    </div>
    <div class="side">
      <div class="stat"><small>נקודות</small><b id="score">0</b></div>
      <div class="stat next"><small>הבא</small><div class="mini t0" id="next">ל</div></div>
    </div>
  </div>

  <div class="wellwrap" id="wellwrap">
    <div class="board" id="board" aria-label="לוח המשחק"></div>
  </div>

  <div class="controls">
    <button id="bLeft" aria-label="שמאלה">◀</button>
    <button id="bDrop" class="drop" aria-label="הפל למטה">⬇</button>
    <button id="bRight" aria-label="ימינה">▶</button>
    <div class="small">
      <button id="bPause" aria-label="השהה">⏸️</button>
      <button id="bSound" aria-label="קול">🔊</button>
    </div>
  </div>
</div>

<div class="overlay" id="menu">
  <div class="panel">
    <h1>מגדל המילים</h1>
    <div class="demo"><span class="t0">כ</span><span class="t2">ל</span><span class="t4">ב</span></div>
    <p>אותיות נופלות מלמעלה. שימו אותן אחת ליד השנייה, מימין לשמאל, או אחת מעל השנייה, כדי לבנות מילה. מילה שלמה נעלמת!</p>
    <p style="font-size:14px;opacity:.8">לוחצים על עמודה כדי להזיז את האות אליה. מחליקים למטה כדי להפיל.</p>
    <div class="modes">
      <button class="easy" id="mEasy">קל<small>אותיות לפי הסדר</small></button>
      <button class="norm" id="mNorm">אתגר<small>אותיות מעורבבות</small></button>
    </div>
    <p id="bestLine" style="font-size:14px"></p>
  </div>
</div>

<div class="overlay" id="over" hidden>
  <div class="panel">
    <h1>המגדל מלא!</h1>
    <div><div class="score-big" id="finalScore">0</div><small>נקודות</small></div>
    <div id="learnedWrap"><p style="font-size:14px;margin-bottom:6px">מילים שבנית:</p><div class="learned" id="learned"></div></div>
    <div class="modes">
      <button class="easy" id="oEasy">שוב · קל</button>
      <button class="norm" id="oNorm">שוב · אתגר</button>
    </div>
  </div>
</div>

<div class="overlay" id="paused" hidden>
  <div class="panel">
    <h1>הפסקה</h1>
    <button id="resume" style="padding:14px;font-size:22px;font-weight:800;background:var(--t4);color:#fff">ממשיכים ▶</button>
    <button id="quit" style="padding:10px;font-size:16px">חזרה לתפריט</button>
  </div>
</div>

<script>
(() => {
  const COLS = 6, ROWS = 9;
  const WORDS = [
    ["דג","🐟"],["ים","🌊"],["לב","❤️"],["יד","✋"],["עץ","🌳"],["צב","🐢"],["אש","🔥"],["הר","⛰️"],["אף","👃"],["פה","👄"],["עז","🐐"],
    ["כלב","🐶"],["סוס","🐴"],["פיל","🐘"],["קוף","🐒"],["דוב","🐻"],["פרה","🐄"],["כבש","🐑"],["לחם","🍞"],["מים","💧"],
    ["שמש","☀️"],["ירח","🌙"],["פרח","🌸"],["בית","🏠"],["ספר","📖"],["גשם","🌧️"],["שלג","❄️"],["עין","👁️"],["רגל","🦶"],
    ["אבא","👨"],["אמא","👩"],["חלב","🥛"],["נעל","👟"],["דבש","🍯"],["נחש","🐍"],["ענן","☁️"],
    ["כוכב","⭐"],["תפוח","🍎"],["כדור","⚽"],["חתול","🐱"],["אריה","🦁"],["בננה","🍌"],["ביצה","🥚"],["שעון","⏰"],
    ["כובע","🧢"],["עוגה","🎂"],["ארנב","🐰"],["פרפר","🦋"],["סירה","⛵"],["רכבת","🚂"],["מטוס","✈️"],["אוזן","👂"],["כיסא","🪑"],["מפתח","🔑"],
    ["ציפור","🐦"],["גלידה","🍦"],["דבורה","🐝"],["תינוק","👶"],["ענבים","🍇"]
  ];
  const DICT = new Map(WORDS);
  const FILLER = "אבגדהוזחטיכלמנסעפצקרשת";
  const BEST_KEY = "word-tower-best";

  const $ = id => document.getElementById(id);
  const board = $("board");
  const cells = [];
  for (let i = 0; i < ROWS * COLS; i++) {
    const d = document.createElement("div");
    d.className = "cell";
    d.dataset.c = i % COLS;
    board.appendChild(d);
    cells.push(d);
  }

  let grid, piece, queue, target, score, level, targetsDone, phase = "menu", mode, timer = null, recent = [], learned;
  let soundOn = true, audio = null, heVoice = null;

  const tileClass = ch => "t" + (ch.charCodeAt(0) % 6);
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const readBest = () => { try { return +localStorage.getItem(BEST_KEY) || 0; } catch { return 0; } };
  const writeBest = v => { try { localStorage.setItem(BEST_KEY, v); } catch {} };

  // ---------- sound ----------
  function tone(freq, dur, type = "sine", vol = .18, delay = 0) {
    if (!soundOn || !audio) return;
    const t = audio.currentTime + delay;
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
    o.connect(g).connect(audio.destination); o.start(t); o.stop(t + dur);
  }
  const sfx = {
    move: () => tone(420, .04, "triangle", .08),
    land: () => tone(160, .1, "sine", .25),
    word: () => [523, 659, 784].forEach((f, i) => tone(f, .18, "triangle", .16, i * .08)),
    target: () => [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, .22, "triangle", .18, i * .09)),
    over: () => [392, 330, 262, 196].forEach((f, i) => tone(f, .3, "sine", .18, i * .15)),
  };
  function pickVoice() {
    try { heVoice = speechSynthesis.getVoices().find(v => /^he|^iw/i.test(v.lang)) || null; } catch { heVoice = null; }
  }
  if ("speechSynthesis" in window) { pickVoice(); speechSynthesis.addEventListener?.("voiceschanged", pickVoice); }
  function speak(text) {
    if (!soundOn || !heVoice) return;
    try {
      const u = new SpeechSynthesisUtterance(text);
      u.voice = heVoice; u.lang = heVoice.lang; u.rate = .85;
      speechSynthesis.cancel(); speechSynthesis.speak(u);
    } catch {}
  }

  // ---------- game flow ----------
  function newGame(m) {
    mode = m;
    if (!audio) { try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch {} }
    audio?.resume?.();
    grid = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
    score = 0; level = 1; targetsDone = 0; learned = [];
    pickTarget();
    $("menu").hidden = $("over").hidden = $("paused").hidden = true;
    phase = "falling";
    spawn();
    restartTimer();
    render();
  }

  function pickTarget() {
    const pool = WORDS.filter(([w]) => mode === "easy" ? w.length <= 3 + (level > 2) : w.length >= 3)
                      .filter(([w]) => !recent.includes(w));
    const [word, emoji] = pool[Math.random() * pool.length | 0];
    recent.push(word); if (recent.length > 8) recent.shift();
    target = { word, emoji };
    queue = [];
    $("tEmoji").textContent = emoji;
    $("tWord").textContent = word;
    $("tSlots").innerHTML = [...word].map(ch => `<span class="${tileClass(ch)}">${ch}</span>`).join("");
  }

  function refill() {
    const letters = [...target.word];
    if (mode === "easy") { queue.push(...letters); return; }
    for (const ch of shuffle(letters)) {
      queue.push(ch);
      if (Math.random() < .25) queue.push(FILLER[Math.random() * FILLER.length | 0]);
    }
  }

  function spawn() {
    if (!queue.length) refill();
    const ch = queue.shift();
    if (!queue.length) refill();
    const c = 2;
    if (grid[0][c]) { gameOver(); return; }
    piece = { ch, r: 0, c };
    const n = $("next"); n.textContent = queue[0]; n.className = "mini " + tileClass(queue[0]);
  }

  const free = (r, c) => r >= 0 && r < ROWS && c >= 0 && c < COLS && !grid[r][c];
  const speed = () => Math.max(300, (mode === "easy" ? 1250 : 950) - (level - 1) * 80);

  function restartTimer() {
    clearInterval(timer);
    timer = setInterval(tick, speed());
  }

  function tick() {
    if (phase !== "falling" || !piece) return;
    if (free(piece.r + 1, piece.c)) { piece.r++; render(); }
    else land();
  }

  function shift(dc) {
    if (phase !== "falling" || !piece) return;
    if (free(piece.r, piece.c + dc)) { piece.c += dc; sfx.move(); render(); }
  }
  function moveTo(c) {
    if (phase !== "falling" || !piece) return;
    const dc = Math.sign(c - piece.c);
    let moved = false;
    while (piece.c !== c && free(piece.r, piece.c + dc)) { piece.c += dc; moved = true; }
    if (moved) { sfx.move(); render(); }
  }
  function hardDrop() {
    if (phase !== "falling" || !piece) return;
    while (free(piece.r + 1, piece.c)) piece.r++;
    land();
  }

  function land() {
    grid[piece.r][piece.c] = { ch: piece.ch };
    piece = null;
    sfx.land();
    render();
    resolve(1);
  }

  // Words read right-to-left along a row (column 0 is the rightmost) or top-to-bottom down a column.
  function findWords() {
    const skip = w => w !== target.word && target.word.includes(w); // don't eat pieces of the word being built
    const found = [];
    const scan = (len, at) => {
      for (let s = 0; s < len; s++) {
        for (let n = len - s; n >= 2; n--) {
          let str = "", run = [];
          for (let k = 0; k < n; k++) {
            const [r, c] = at(s + k), cell = grid[r][c];
            if (!cell) { str = null; break; }
            str += cell.ch; run.push([r, c]);
          }
          if (str && DICT.has(str) && !skip(str)) { found.push({ word: str, cells: run }); break; }
        }
      }
    };
    for (let r = 0; r < ROWS; r++) scan(COLS, i => [r, i]);
    for (let c = 0; c < COLS; c++) scan(ROWS, i => [i, c]);
    // drop matches fully covered by a longer one (e.g. "לב" inside "כלב")
    found.sort((a, b) => b.cells.length - a.cells.length);
    const kept = [], covered = new Set();
    for (const f of found) {
      const keys = f.cells.map(([r, c]) => r * COLS + c);
      if (keys.every(k => covered.has(k))) continue;
      keys.forEach(k => covered.add(k));
      kept.push(f);
    }
    return kept;
  }

  function resolve(chain) {
    const found = findWords();
    if (!found.length) { spawn(); render(); return; }
    phase = "clearing";
    let hitTarget = false;
    for (const f of found) {
      f.cells.forEach(([r, c]) => cells[r * COLS + c].classList.add("pop"));
      if (f.word === target.word) hitTarget = true;
      score += f.word.length * (f.word === target.word ? 50 : 15) * chain;
      if (!learned.includes(f.word)) learned.push(f.word);
    }
    $("score").textContent = score;
    const main = found.find(f => f.word === target.word) || found[0];
    toast(main.word, DICT.get(main.word), hitTarget);
    speak(main.word);
    hitTarget ? sfx.target() : sfx.word();

    setTimeout(() => {
      for (const f of found) f.cells.forEach(([r, c]) => grid[r][c] = null);
      cells.forEach(el => el.classList.remove("pop"));
      for (let c = 0; c < COLS; c++) {
        const stack = [];
        for (let r = ROWS - 1; r >= 0; r--) if (grid[r][c]) stack.push(grid[r][c]);
        for (let r = ROWS - 1, i = 0; r >= 0; r--, i++) grid[r][c] = stack[i] || null;
      }
      if (hitTarget) {
        targetsDone++;
        if (targetsDone % 3 === 0) { level++; restartTimer(); }
        pickTarget();
      }
      phase = "falling";
      render();
      setTimeout(() => resolve(chain + 1), 120);
    }, 560);
  }

  function toast(word, emoji, big) {
    const t = document.createElement("div");
    t.className = "toast" + (big ? " big" : "");
    t.innerHTML = `<span class="e">${emoji}</span><span>${word}</span>` + (big ? "<small>כל הכבוד!</small>" : "");
    $("wellwrap").appendChild(t);
    setTimeout(() => t.remove(), 1150);
  }

  function gameOver() {
    phase = "over"; piece = null; clearInterval(timer);
    sfx.over();
    const best = Math.max(readBest(), score); writeBest(best);
    $("finalScore").textContent = score;
    $("learned").innerHTML = learned.map(w => `<span>${DICT.get(w)} ${w}</span>`).join("");
    $("learnedWrap").hidden = !learned.length;
    $("over").hidden = false;
    render();
  }

  function pause(on) {
    if (phase === "menu" || phase === "over") return;
    if (on && phase === "falling") { phase = "paused"; $("paused").hidden = false; }
    else if (!on && phase === "paused") { phase = "falling"; $("paused").hidden = true; restartTimer(); }
  }

  // ---------- render ----------
  function render() {
    let ghostR = -1;
    if (piece) { ghostR = piece.r; while (free(ghostR + 1, piece.c)) ghostR++; }
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      const el = cells[r * COLS + c], cell = grid?.[r][c];
      if (piece && piece.r === r && piece.c === c) { el.className = "cell tile falling " + tileClass(piece.ch); el.textContent = piece.ch; }
      else if (cell) { if (!el.classList.contains("pop")) el.className = "cell tile " + tileClass(cell.ch); el.textContent = cell.ch; }
      else if (piece && piece.c === c && ghostR === r && ghostR !== piece.r) { el.className = "cell ghost"; el.textContent = piece.ch; }
      else { el.className = "cell"; el.textContent = ""; }
    }
  }

  function fit() {
    const w = $("wellwrap");
    const size = Math.floor(Math.min((w.clientWidth - 14) / COLS - 3, (w.clientHeight - 20) / ROWS - 3));
    document.documentElement.style.setProperty("--cell", Math.max(26, Math.min(64, size)) + "px");
  }
  addEventListener("resize", fit);

  // ---------- input ----------
  // Board is drawn right-to-left, so "left" on screen is a higher column index.
  $("bLeft").onclick = () => shift(1);
  $("bRight").onclick = () => shift(-1);
  $("bDrop").onclick = hardDrop;
  $("bPause").onclick = () => pause(true);
  $("resume").onclick = () => pause(false);
  $("quit").onclick = () => { phase = "menu"; clearInterval(timer); $("paused").hidden = true; showMenu(); };
  $("bSound").onclick = () => { soundOn = !soundOn; $("bSound").textContent = soundOn ? "🔊" : "🔇"; if (!soundOn) try { speechSynthesis.cancel(); } catch {} };
  $("mEasy").onclick = $("oEasy").onclick = () => newGame("easy");
  $("mNorm").onclick = $("oNorm").onclick = () => newGame("normal");

  let startY = null, startCol = null;
  board.addEventListener("pointerdown", e => {
    startY = e.clientY;
    startCol = e.target.closest(".cell")?.dataset.c;
  });
  board.addEventListener("pointerup", e => {
    if (startY === null) return;
    const dy = e.clientY - startY;
    if (dy > 40) hardDrop();
    else if (startCol !== undefined) moveTo(+startCol);
    startY = null;
  });

  addEventListener("keydown", e => {
    const k = e.key;
    if (k === "ArrowLeft") shift(1);
    else if (k === "ArrowRight") shift(-1);
    else if (k === "ArrowDown") tick();
    else if (k === " " || k === "Enter") { if (phase === "falling") hardDrop(); else return; }
    else if (k === "p" || k === "Escape") pause(phase === "falling");
    else return;
    e.preventDefault();
  });
  document.addEventListener("visibilitychange", () => { if (document.hidden) pause(true); });

  function showMenu() {
    const best = readBest();
    $("bestLine").textContent = best ? `השיא שלך: ${best} נקודות` : "";
    $("menu").hidden = false;
  }

  // Resting state behind the menu: a half-built board so the first frame shows the game.
  grid = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
  [["ח", 8, 0], ["ת", 8, 1], ["ו", 8, 2], ["ש", 8, 4], ["מ", 7, 4], ["א", 8, 5], ["ב", 7, 5], ["י", 8, 3]].forEach(([ch, r, c]) => grid[r][c] = { ch });
  target = { word: "חתול", emoji: "🐱" };
  $("tEmoji").textContent = "🐱"; $("tWord").textContent = "חתול";
  $("tSlots").innerHTML = [..."חתול"].map(ch => `<span class="${tileClass(ch)}">${ch}</span>`).join("");
  piece = { ch: "ל", r: 3, c: 3 };
  $("next").textContent = "ש"; $("next").className = "mini " + tileClass("ש");
  fit(); render(); piece = null; showMenu();
})();
</script>

</body>
</html>
